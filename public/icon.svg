<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d24" />
      <stop offset="50%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#ec4899" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#spaceGrad)"/>
  
  <!-- Stars / Orbit Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="12 16" opacity="0.4"/>
  <circle cx="120" cy="140" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="390" cy="110" r="6" fill="#38bdf8" opacity="0.8"/>
  <circle cx="380" cy="380" r="5" fill="#f43f5e" opacity="0.7"/>
  <circle cx="130" cy="370" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- Planet Asahi ring & body -->
  <g transform="translate(256, 256)">
    <!-- Planet ring -->
    <ellipse cx="0" cy="0" rx="130" ry="40" fill="none" stroke="#38bdf8" stroke-width="12" transform="rotate(-25)" opacity="0.8"/>
    
    <!-- Planet sphere -->
    <circle cx="0" cy="0" r="85" fill="url(#rocketGrad)" filter="url(#glow)"/>
    <circle cx="-25" cy="-25" r="70" fill="#ffffff" opacity="0.15"/>
    
    <!-- Rocket in center -->
    <g transform="scale(1.2)">
      <!-- Rocket body -->
      <path d="M0 -55 C22 -35 24 15 15 35 L-15 35 C-24 15 -22 -35 0 -55 Z" fill="#ffffff"/>
      <!-- Window -->
      <circle cx="0" cy="-10" r="10" fill="#0284c7"/>
      <circle cx="-3" cy="-13" r="3" fill="#ffffff" opacity="0.8"/>
      <!-- Wings -->
      <path d="M-15 18 L-32 36 L-15 32 Z" fill="#fb7185"/>
      <path d="M15 18 L32 36 L15 32 Z" fill="#fb7185"/>
      <!-- Flame -->
      <path d="M-8 36 Q0 58 8 36 Q0 48 -8 36 Z" fill="#facc15"/>
    </g>
  </g>
</svg>
